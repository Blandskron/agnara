# Every third-party action on the publication path is pinned to a full commit
# SHA (ADR 0079). A pin nobody can move is a pin that rots, so Dependabot owns
# moving them: it rewrites the SHA and the trailing human version together, and
# the change arrives as an ordinary reviewed pull request.
#
# Only GitHub Actions is enabled for version updates. Dependabot does now
# support a `uv` ecosystem, and it maintains `uv.lock` correctly: the security
# update that moved `mcp` to 2.2.0 arrived on a `dependabot/uv/` branch with
# `Lockfile is current` passing. Routine Python version updates stay off anyway,
# because this repository pins protocol and host-fixture versions deliberately
# and each move needs the reviewed procedure in ADR 0010, not a weekly bump.
#
# Security updates are separate and cannot be routed. GitHub raises them
# against the default branch, `main`, whatever this file says, and configuring
# `target-branch` for an ecosystem makes that ecosystem's options apply to
# version updates only. SECURITY.md records how such a pull request is triaged
# against the branch model.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # GitHub reads this configuration from the default branch, so the target
    # takes effect when the reviewed configuration is promoted to main.
    # Routine version updates follow the integration branch. Security updates
    # continue to use GitHub's default-branch behavior independently.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies
      - supply-chain
    groups:
      # One pull request for the routine bumps. A change to the publisher
      # action is reviewed on its own, because that is the action that holds
      # the OIDC token.
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "pypa/gh-action-pypi-publish"
