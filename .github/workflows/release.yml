  publish-telemetry:
    name: Publish agnara-telemetry (bootstrap-2)
    if: ${{ inputs.phase == 'bootstrap-2' }}
    needs: [preconditions, publish-mcp]
    runs-on: ubuntu-latest
    environment:
      name: pypi-telemetry
      url: https://pypi.org/manage/projects/
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISH_PROJECT: agnara-telemetry
      PUBLISH_ENVIRONMENT: pypi-telemetry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install "$BASELINE_PYTHON"

      - name: Re-check every precondition after approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv run --no-project python scripts/check_release_preconditions.py \
            --version "$RELEASE_VERSION" \
            --require-protected-environment pypi

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agnara-distributions
          path: dist/

      # The bundle crossed a job boundary. Re-assert that it is still exactly
      # the reviewed set at the dispatched version, that this job is the
      # recorded bootstrap identity of its project, and that its project
      # belongs to the dispatched phase, before anything is uploaded.
      - name: Re-validate the downloaded bundle and this upload's identity
        run: |
          set -euo pipefail
          uv run --no-project python scripts/check_publication_readiness.py \
            --workspace "$GITHUB_WORKSPACE" \
            --version "$RELEASE_VERSION" \
            --phase "$RELEASE_PHASE" --dist dist/ --oidc-identity \
            --project "$PUBLISH_PROJECT" --environment "$PUBLISH_ENVIRONMENT"

      # Only this project's wheel and sdist. The directory is the canonical
      # PyPI project name: `agnara-a2a`, never `agnara_a2a`, which is only the
      # filename normalization inside it.
      - name: Stage this distribution
        run: |
          set -euo pipefail
          stem="${PUBLISH_PROJECT//-/_}"
          mkdir -p "staged/$PUBLISH_PROJECT"
          cp "dist/${stem}-${RELEASE_VERSION}-py3-none-any.whl" "staged/$PUBLISH_PROJECT/"
