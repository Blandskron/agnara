      - name: Publish agnara-telemetry
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: staged/agnara-telemetry
          verify-metadata: true
          attestations: true
          print-hash: true

  # Completeness, not installability: the projects published so far must each
  # carry a wheel and an sdist at this version, and nothing of a later phase
  # may exist. The adapters pin a kernel that is not on the index yet, so an
  # installation is only possible -- and only meaningful -- in the final phase.
  # No tag is created in a bootstrap phase.
  verify-bootstrap-2:
    name: Verify the bootstrap-2 publication on PyPI
    if: ${{ inputs.phase == 'bootstrap-2' }}
    needs: [preconditions, publish-telemetry]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install "$BASELINE_PYTHON"

      - name: Every distribution published so far is complete on the index
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if uv run --no-project python scripts/check_publication_readiness.py \
                 --workspace "$GITHUB_WORKSPACE" --version "$RELEASE_VERSION" \
                 --phase "$RELEASE_PHASE" --online --require-published; then
              exit 0
            fi
            echo "index not consistent yet; attempt $attempt of 6"
            sleep 20
          done
          echo "::error::the index never reported the $RELEASE_PHASE distributions complete at $RELEASE_VERSION"
          exit 1

  publish-core:
    name: Publish agnara (final)
    if: ${{ inputs.phase == 'final' }}
    needs: [preconditions, publish]
    runs-on: ubuntu-latest
    environment:
      name: pypi-core
      url: https://pypi.org/manage/projects/
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISH_PROJECT: agnara
      PUBLISH_ENVIRONMENT: pypi-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install "$BASELINE_PYTHON"

      - name: Re-check every precondition after approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv run --no-project python scripts/check_release_preconditions.py \
            --version "$RELEASE_VERSION" \
            --require-protected-environment pypi

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agnara-distributions
          path: dist/

      # The bundle crossed a job boundary. Re-assert that it is still exactly
      # the reviewed set at the dispatched version, that this job is the
      # recorded bootstrap identity of its project, and that its project
      # belongs to the dispatched phase, before anything is uploaded.
      - name: Re-validate the downloaded bundle and this upload's identity
        run: |
          set -euo pipefail
          uv run --no-project python scripts/check_publication_readiness.py \
            --workspace "$GITHUB_WORKSPACE" \
            --version "$RELEASE_VERSION" \
            --phase "$RELEASE_PHASE" --dist dist/ --oidc-identity \
            --project "$PUBLISH_PROJECT" --environment "$PUBLISH_ENVIRONMENT"

      # Only this project's wheel and sdist. The directory is the canonical
      # PyPI project name: `agnara-a2a`, never `agnara_a2a`, which is only the
      # filename normalization inside it.
      - name: Stage this distribution
        run: |
          set -euo pipefail
          stem="${PUBLISH_PROJECT//-/_}"
          mkdir -p "staged/$PUBLISH_PROJECT"
          cp "dist/${stem}-${RELEASE_VERSION}-py3-none-any.whl" "staged/$PUBLISH_PROJECT/"
          cp "dist/${stem}-${RELEASE_VERSION}.tar.gz" "staged/$PUBLISH_PROJECT/"

      - name: Publish agnara
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: staged/agnara
          verify-metadata: true
          attestations: true
          print-hash: true

  verify-published:
    name: Post-release verification
    if: ${{ inputs.phase == 'final' }}
    needs: [preconditions, publish-core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install "$BASELINE_PYTHON"

      # Completeness, not installability. `agnara 0.1.0a4` is installable and
      # has no sdist; this fails on exactly that, for each of the seven.
      - name: Every distribution is complete on the index
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          for attempt in 1 2 3 4 5 6; do
            if uv run --no-project python scripts/check_publication_readiness.py \
                 --workspace "$GITHUB_WORKSPACE" --version "$version" \
                 --phase "$RELEASE_PHASE" --online --require-published; then
              exit 0
            fi
            echo "index not consistent yet; attempt $attempt of 6"
            sleep 20
          done
          echo "::error::the index never reported all distributions complete at $version"
          exit 1

      - name: Install the published set and exercise it
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          manifest() {
            uv run --no-project python "$GITHUB_WORKSPACE/scripts/distributions.py" "$@"
          }
          readarray -t pinned < <(manifest --pinned "$version")
          imports="$(manifest --import-names --separator ', ')"
          readarray -t scripts < <(manifest --console-scripts | grep -v '^$' || true)

          rm -rf /tmp/post-release
          mkdir -p /tmp/post-release
          cd /tmp/post-release

          # Same reasoning as the pre-publish smoke test: drive the venv
          # interpreter directly so this cannot pass against some other
          # environment that `uv run` happened to resolve.
          uv venv --python "$BASELINE_PYTHON" .venv
          RELEASE_PYTHON=/tmp/post-release/.venv/bin/python

          uv pip install --python "$RELEASE_PYTHON" "${pinned[@]}"
          "$RELEASE_PYTHON" -I -c "import ${imports}; import agnara; print(agnara.__version__)"
          for script in "${scripts[@]-}"; do
            [[ -n "$script" ]] && ".venv/bin/${script}" --version
          done

  # Only now, in the final phase, with all fourteen files on the index and the
  # published set installed and exercised, does the version become a fact of
  # the repository. A failed upload or a failed verification leaves no tag
  # behind: this job depends on both having succeeded, runs in no other phase,
  # and nothing else creates one. The dispatched commit is tagged whether or
  # not main has moved since, because PyPI already holds exactly what that
  # commit built.
  tag:
    name: Tag the verified release
    if: ${{ inputs.phase == 'final' }}
    needs: [preconditions, publish-core, verify-published]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install "$BASELINE_PYTHON"

      - name: The published commit is checked out and the version is still untagged
        run: |
          set -euo pipefail
          uv run --no-project python scripts/check_release_preconditions.py \
            --version "$RELEASE_VERSION" --after-publication

      - name: Create the annotated release tag on the published commit
        id: tag
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISPATCHED_BY: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" \
            -m "Agnara ${tag}" \
            -m "Created by release run ${RUN_URL}, dispatched by ${DISPATCHED_BY} from main at ${GITHUB_SHA}, after all seven distributions were published to PyPI and verified complete."
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: The tag is annotated, names this commit and reviewed main history
        run: |
          set -euo pipefail
          uv run --no-project python scripts/check_release_tag.py "v${RELEASE_VERSION}"

  # Last. The tag exists only because publication was verified, and this job
  # exists only because the tag does.
  github-release:
    name: Create GitHub Release
    if: ${{ inputs.phase == 'final' }}
    needs: [preconditions, publish-core, verify-published, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agnara-distributions
          path: dist/

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Agnara ${{ needs.tag.outputs.tag }}
          # Curated notes per ADR 0021 step 7; the generated PR list is
          # appended below them. `check_publication_readiness.py` already
          # refused the release if this file is missing, so the notes can no
          # longer degrade silently to the generated list.
          body_path: docs/releases/${{ needs.tag.outputs.tag }}.md
          generate_release_notes: true
          files: dist/*
          # PEP 440 pre-release segments must never ship as a stable release.
          prerelease: ${{ contains(needs.preconditions.outputs.version, 'a') || contains(needs.preconditions.outputs.version, 'b') || contains(needs.preconditions.outputs.version, 'rc') }}
