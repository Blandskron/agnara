name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Quality Gates
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Build sdist and wheel for agnara
        run: uv build --package agnara
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agnara-dist
          path: dist/
          retention-days: 1

  test-artifact:
    name: Validate built artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: agnara-dist
          path: dist/
          
      - name: Check version consistency
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            WHEEL_FILE=(dist/*.whl)
            WHEEL_NAME=$(basename $WHEEL_FILE)
            if [[ "$WHEEL_NAME" != *"-$TAG_VERSION-"* ]]; then
              echo "Error: Wheel version in $WHEEL_NAME does not match tag v$TAG_VERSION"
              exit 1
            fi
          fi
          
      - name: Install and smoke test outside workspace
        run: |
          mkdir /tmp/smoke-test
          cd /tmp/smoke-test
          uv venv
          uv pip install $GITHUB_WORKSPACE/dist/agnara-*.whl
          uv run python -c "import agnara; print(agnara.__version__)"
          uv run python -c "from agnara import CapabilityDefinition, Agnara"

  publish:
    name: Publish to PyPI
    needs: test-artifact
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agnara
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: write  # Needed to create GitHub Release
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: agnara-dist
          path: dist/
          
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          
      - name: Post-release verification
        run: |
          # Wait a few seconds for PyPI to index
          sleep 30
          mkdir /tmp/post-release
          cd /tmp/post-release
          uv venv
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            uv pip install agnara==$TAG_VERSION
          else
            uv pip install agnara
          fi
          uv run python -c "import agnara; print(agnara.__version__)"
          
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Curated notes per ADR 0021 step 7; the generated PR list is
          # appended below them. A tag without a notes file falls back to the
          # generated list alone.
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: dist/*
          # PEP 440 pre-release segments must never ship as a stable release.
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
