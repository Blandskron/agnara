name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: false

permissions:
  contents: read

env:
  # Fail rather than silently fall back to a different interpreter. Without
  # this, `uv venv` picked the runner's CPython 3.12 and the >=3.14 wheel
  # became uninstallable in the validation job.
  UV_PYTHON_DOWNLOADS: manual

jobs:
  validate:
    name: Validate Quality Gates
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Verify annotated release tag belongs to main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: uv run --no-project python scripts/check_release_tag.py "${GITHUB_REF#refs/tags/}"
          
      - name: Build every reviewed distribution
        run: uv build --all-packages --out-dir dist/

      - name: Validate artifact set, metadata, contents and tag version
        run: |
          set -euo pipefail
          expected=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected=(--expected-version "${GITHUB_REF#refs/tags/v}")
          fi
          uv run --no-project python scripts/check_distributions.py \
            --workspace "$GITHUB_WORKSPACE" --dist dist/ "${expected[@]}"
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agnara-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  test-artifact:
    name: Validate built artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python 3.14
        run: uv python install 3.14
        
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: agnara-distributions
          path: dist/
          
      - name: Install and smoke test outside workspace
        env:
          EXPECTED_PYTHON: "3.14"
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          if [[ "${#wheels[@]}" -ne 7 ]]; then
            echo "::error::expected exactly seven reviewed wheels in dist/, found ${#wheels[@]}: ${wheels[*]-}"
            exit 1
          fi

          rm -rf /tmp/smoke-test
          mkdir -p /tmp/smoke-test
          cd /tmp/smoke-test

          # Address the interpreter explicitly instead of going through
          # `uv run`. `uv run` re-discovers (and may create) an environment of
          # its own, so it can report success against something other than the
          # venv the wheel was installed into.
          uv venv --python "$EXPECTED_PYTHON" .venv
          SMOKE_PYTHON=/tmp/smoke-test/.venv/bin/python

          # Resolve only adapter-owned third-party dependencies from the
          # index. The complete first-party candidate is then installed with
          # index access disabled, so an adapter cannot substitute PyPI core.
          uv pip install --python "$SMOKE_PYTHON" \
            "mcp==2.1.1" "opentelemetry-api>=1.44,<2"
          uv pip install --python "$SMOKE_PYTHON" \
            --no-index --find-links "$GITHUB_WORKSPACE/dist" "${wheels[@]}"

          expected=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected=(--expected-version "${GITHUB_REF#refs/tags/v}")
          fi
          "$SMOKE_PYTHON" -I "$GITHUB_WORKSPACE/scripts/check_distributions.py" \
            --workspace "$GITHUB_WORKSPACE" --require-installed "${expected[@]}"
          "$SMOKE_PYTHON" -I -c \
            "import agnara, agnara_a2a, agnara_cli, agnara_events, agnara_http, agnara_mcp, agnara_telemetry"
          .venv/bin/agnara --version

  publish:
    name: Publish to PyPI
    needs: test-artifact
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/manage/projects/
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: write  # Needed to create GitHub Release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Recheck release tag before publication
        run: uv run --no-project python scripts/check_release_tag.py "${GITHUB_REF#refs/tags/}"

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: agnara-distributions
          path: dist/
          
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          verify-metadata: true
          attestations: true
          print-hash: true
          
      - name: Post-release verification
        run: |
          set -euo pipefail

          # Wait a few seconds for PyPI to index
          sleep 30

          rm -rf /tmp/post-release
          mkdir -p /tmp/post-release
          cd /tmp/post-release

          # Same reasoning as the pre-publish smoke test: drive the venv
          # interpreter directly so this cannot pass against some other
          # environment that `uv run` happened to resolve.
          uv venv --python 3.14 .venv
          RELEASE_PYTHON=/tmp/post-release/.venv/bin/python

          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          uv pip install --python "$RELEASE_PYTHON" \
            "agnara==$TAG_VERSION" \
            "agnara-a2a==$TAG_VERSION" \
            "agnara-cli==$TAG_VERSION" \
            "agnara-events==$TAG_VERSION" \
            "agnara-http==$TAG_VERSION" \
            "agnara-mcp==$TAG_VERSION" \
            "agnara-telemetry==$TAG_VERSION"

          "$RELEASE_PYTHON" -I -c \
            "import agnara, agnara_a2a, agnara_cli, agnara_events, agnara_http, agnara_mcp, agnara_telemetry; print(agnara.__version__)"
          .venv/bin/agnara --version
          
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          # Curated notes per ADR 0021 step 7; the generated PR list is
          # appended below them. A tag without a notes file falls back to the
          # generated list alone.
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: dist/*
          # PEP 440 pre-release segments must never ship as a stable release.
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
