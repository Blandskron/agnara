name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: false

permissions:
  contents: read

env:
  # Fail rather than silently fall back to a different interpreter. Without
  # this, `uv venv` picked the runner's CPython 3.12 and the >=3.14 wheel
  # became uninstallable in the validation job.
  UV_PYTHON_DOWNLOADS: manual

jobs:
  validate:
    name: Validate Quality Gates
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14
          
      - name: Build sdist and wheel for agnara
        run: uv build --package agnara
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agnara-dist
          path: dist/
          retention-days: 1

  test-artifact:
    name: Validate built artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.14
        run: uv python install 3.14
        
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: agnara-dist
          path: dist/
          
      - name: Check version consistency
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            WHEEL_FILE=(dist/*.whl)
            WHEEL_NAME=$(basename $WHEEL_FILE)
            if [[ "$WHEEL_NAME" != *"-$TAG_VERSION-"* ]]; then
              echo "Error: Wheel version in $WHEEL_NAME does not match tag v$TAG_VERSION"
              exit 1
            fi
          fi
          
      - name: Install and smoke test outside workspace
        env:
          EXPECTED_PYTHON: "3.14"
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Resolve the wheel before leaving the workspace, and insist on
          # exactly one: a stale extra wheel in dist/ would otherwise make the
          # glob expand to two arguments and validate an artifact we are not
          # about to publish.
          wheels=("$GITHUB_WORKSPACE"/dist/agnara-*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one agnara wheel in dist/, found ${#wheels[@]}: ${wheels[*]-}"
            exit 1
          fi
          WHEEL="${wheels[0]}"
          echo "Wheel under test: $(basename "$WHEEL")"

          rm -rf /tmp/smoke-test
          mkdir -p /tmp/smoke-test
          cd /tmp/smoke-test

          # Address the interpreter explicitly instead of going through
          # `uv run`. `uv run` re-discovers (and may create) an environment of
          # its own, so it can report success against something other than the
          # venv the wheel was installed into.
          uv venv --python "$EXPECTED_PYTHON" .venv
          SMOKE_PYTHON=/tmp/smoke-test/.venv/bin/python

          uv pip install --python "$SMOKE_PYTHON" "$WHEEL"

          "$SMOKE_PYTHON" -c "import agnara; print(agnara.__version__)"
          "$SMOKE_PYTHON" -c "from agnara import CapabilityDefinition, Agnara"

          cat > assert_install.py <<'PYCODE'
          """Assert the wheel, not the checkout, is what just got imported."""
          import os
          import sys
          from importlib.metadata import version

          import agnara
          from agnara import Agnara, CapabilityDefinition  # noqa: F401

          failures: list[str] = []

          want_python = tuple(int(part) for part in os.environ["EXPECTED_PYTHON"].split("."))
          if sys.version_info[: len(want_python)] != want_python:
              failures.append(
                  f"interpreter is {sys.version.split()[0]}, expected {os.environ['EXPECTED_PYTHON']}"
              )

          expected_version = os.environ.get("EXPECTED_VERSION")
          if expected_version and agnara.__version__ != expected_version:
              failures.append(
                  f"agnara.__version__ is {agnara.__version__!r}, expected {expected_version!r}"
              )
          if agnara.__version__ != version("agnara"):
              failures.append(
                  f"agnara.__version__ ({agnara.__version__}) disagrees with installed "
                  f"distribution metadata ({version('agnara')})"
              )

          # A wheel that failed to install can still import when the checkout is
          # on sys.path, which is the failure this gate exists to catch.
          origin = os.path.realpath(agnara.__file__)
          if "site-packages" not in origin.split(os.sep):
              failures.append(f"agnara imported from {origin}, which is not an installed location")
          workspace = os.path.realpath(os.environ["GITHUB_WORKSPACE"])
          if os.path.commonpath([origin, workspace]) == workspace:
              failures.append(f"agnara imported from the checkout at {origin}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)

          print(f"agnara {agnara.__version__} imported from {origin} on Python {sys.version.split()[0]}")
          PYCODE

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export EXPECTED_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          "$SMOKE_PYTHON" assert_install.py

  publish:
    name: Publish to PyPI
    needs: test-artifact
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agnara
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: write  # Needed to create GitHub Release
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: agnara-dist
          path: dist/
          
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          
      - name: Post-release verification
        run: |
          set -euo pipefail

          # Wait a few seconds for PyPI to index
          sleep 30

          rm -rf /tmp/post-release
          mkdir -p /tmp/post-release
          cd /tmp/post-release

          # Same reasoning as the pre-publish smoke test: drive the venv
          # interpreter directly so this cannot pass against some other
          # environment that `uv run` happened to resolve.
          uv venv --python 3.14 .venv
          RELEASE_PYTHON=/tmp/post-release/.venv/bin/python

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            uv pip install --python "$RELEASE_PYTHON" "agnara==$TAG_VERSION"
          else
            uv pip install --python "$RELEASE_PYTHON" agnara
          fi

          "$RELEASE_PYTHON" -c "import agnara; print(agnara.__version__)"
          "$RELEASE_PYTHON" -c "from agnara import CapabilityDefinition, Agnara"
          
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Curated notes per ADR 0021 step 7; the generated PR list is
          # appended below them. A tag without a notes file falls back to the
          # generated list alone.
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: dist/*
          # PEP 440 pre-release segments must never ship as a stable release.
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
