          cp "dist/${stem}-${RELEASE_VERSION}-py3-none-any.whl" "staged/$PUBLISH_PROJECT/"
          cp "dist/${stem}-${RELEASE_VERSION}.tar.gz" "staged/$PUBLISH_PROJECT/"

      - name: Publish agnara-http
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
