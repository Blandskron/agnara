name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # `release.yml` re-runs these gates before it builds or publishes anything.
  # Without `workflow_call` that job cannot start at all.
  workflow_call:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail rather than silently fall back to a different interpreter.
  UV_PYTHON_DOWNLOADS: manual
  FORCE_COLOR: "1"

jobs:
  security:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze and upload security results
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}

  # The fast gates. They do not vary by operating system, so running them
  # once keeps pull-request feedback quick.
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check --diff .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --locked

      - name: ty
        run: uv run ty check

  # E0.8: Linux, macOS and Windows.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --locked

      - name: Verify the baseline interpreter
        run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version; print(sys.version)"

      - name: Pytest
        run: uv run pytest

  # Enforce docs/performance/budgets.json. Budgets are ratios between two
  # scenarios measured in the same process and run, so a shared runner being slow
  # does not by itself fail this lane; only Agnara's own cost moving relative to
  # the interpreter underneath it does. One fixed runner keeps the comparison
  # meaningful, which is why this is not part of the OS matrix above.
  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --locked

      # The checker is only useful if a real over-budget result is known to
      # stop this required job. These deterministic subprocess tests exercise
      # that failure path without running a second machine-dependent benchmark.
      - name: Prove an artificial performance regression is rejected
        run: uv run pytest tests/benchmarks/test_performance_budget_gate.py

      - name: Record the runtime paths benchmark
        run: uv run python benchmarks/runtime_paths.py --json > runtime-paths.json

      - name: Enforce performance budgets
        run: uv run python scripts/check_performance_budgets.py --record runtime-paths.json

      - name: Upload the raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-measurements
          path: runtime-paths.json

  # E6.18: run vendored documentation UIs under a browser-enforced CSP. The
  # ordinary test matrix deliberately does not download browser binaries.
  browser:
    name: Documentation browsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --locked

      - name: Install pinned Chromium and system dependencies
        run: uv run playwright install --with-deps chromium

      - name: Documentation provider browser conformance
        env:
          AGNARA_RUN_BROWSER_TESTS: "1"
        run: >-
          uv run pytest tests/http/test_documentation_browser.py
          tests/http/test_public_documentation_browser.py -m browser

      - name: Explorer browser accessibility and navigation
        env:
          AGNARA_RUN_BROWSER_TESTS: "1"
        run: uv run pytest tests/http/test_explorer_browser.py -m browser

  # The lockfile is a merge gate: an unlocked change would let CI and a
  # developer machine resolve different dependency sets.
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Check uv.lock
        run: uv lock --check

  # Packaging is otherwise only exercised by `release.yml`, so a broken
  # build, a dropped `py.typed` or a missing vendored asset would stay
  # invisible until release day. This builds every distribution and installs
  # all of them into one clean environment outside the workspace, which is
  # what resolves the adapters' third-party pins. It deliberately does not
  # repeat the deeper artifact validation `release.yml` runs against the
  # exact tagged wheel.
  package:
    name: Build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Build every distribution
        run: uv build --all-packages --out-dir dist/

      - name: Every distribution built exactly one wheel and one sdist
        run: |
          set -euo pipefail
          uv run --no-project python scripts/check_distributions.py \
            --workspace "$GITHUB_WORKSPACE" --dist dist/

      - name: Install every distribution outside the workspace
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifest() {
            uv run --no-project python "$GITHUB_WORKSPACE/scripts/distributions.py" "$@"
          }
          expected_count="$(manifest --count)"
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          if [[ "${#wheels[@]}" -ne "$expected_count" ]]; then
            echo "::error::expected $expected_count reviewed wheels, found ${#wheels[@]}"
            exit 1
          fi
          mkdir -p /tmp/ci-install && cd /tmp/ci-install
          uv venv --python 3.14 .venv

          # Resolve adapter-owned third-party dependencies from the index,
          # then close the index before installing the complete first-party
          # wheel set. The installed-metadata gate below independently checks
          # that every adapter retained its exact core requirement. Which
          # requirements those are comes from docs/distributions.json, the
          # same single source the release workflow and release scripts read,
          # so an adapter that gains a dependency cannot leave a stale copy
          # of this list behind.
          readarray -t third_party < <(manifest --third-party | grep -v '^$' || true)
          if [[ "${#third_party[@]}" -gt 0 ]]; then
            uv pip install --python .venv/bin/python "${third_party[@]}"
          fi
          uv pip install --python .venv/bin/python \
            --no-index --find-links "$GITHUB_WORKSPACE/dist" "${wheels[@]}"

          # Address the interpreter directly: `uv run` may resolve an
          # environment other than the one the wheels were installed into.
          .venv/bin/python -I "$GITHUB_WORKSPACE/scripts/check_distributions.py" \
            --workspace "$GITHUB_WORKSPACE" --require-installed

          # The published distribution additionally has to work on its own.
          .venv/bin/python -c "
          import agnara
          from agnara import Agnara, CapabilityId, Risk
          app = Agnara('smoke')
          assert app.name == 'smoke'
          assert '__version__' in agnara.__all__
          print('imported agnara', agnara.__version__)
          "

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build reference image
        run: >-
          docker build --tag agnara:ci
          --build-arg OCI_CREATED="$GITHUB_RUN_STARTED_AT"
          --build-arg OCI_REVISION="$GITHUB_SHA" .
        env:
          GITHUB_RUN_STARTED_AT: ${{ github.run_started_at }}

      - name: Smoke test reference image
        run: python scripts/container_smoke.py agnara:ci

  # Aggregates every required check into one status, so branch protection
  # needs a single entry that does not have to be edited when the matrix
  # changes. See BACKLOG.md E0B.4.
  ci:
    name: CI
    if: always()
    needs: [security, lint, types, test, performance, browser, lockfile, package, container]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more required jobs failed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - name: All required jobs succeeded
        run: echo "ok"
