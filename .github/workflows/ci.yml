name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # `release.yml` re-runs these gates before it builds or publishes anything.
  # Without `workflow_call` that job cannot start at all.
  workflow_call:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail rather than silently fall back to a different interpreter.
  UV_PYTHON_DOWNLOADS: manual
  FORCE_COLOR: "1"

jobs:
  # The fast gates. They do not vary by operating system, so running them
  # once keeps pull-request feedback quick.
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check --diff .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --locked

      - name: ty
        run: uv run ty check

  # E0.8: Linux, macOS and Windows.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --locked

      - name: Verify the baseline interpreter
        run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version; print(sys.version)"

      - name: Pytest
        run: uv run pytest

  # E6.18: run vendored documentation UIs under a browser-enforced CSP. The
  # ordinary test matrix deliberately does not download browser binaries.
  browser:
    name: Documentation browsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --locked

      - name: Install pinned Chromium and system dependencies
        run: uv run playwright install --with-deps chromium

      - name: Documentation provider browser conformance
        env:
          AGNARA_RUN_BROWSER_TESTS: "1"
        run: uv run pytest tests/http/test_documentation_browser.py -m browser

      - name: Explorer browser accessibility and navigation
        env:
          AGNARA_RUN_BROWSER_TESTS: "1"
        run: uv run pytest tests/http/test_explorer_browser.py -m browser

  # The lockfile is a merge gate: an unlocked change would let CI and a
  # developer machine resolve different dependency sets.
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Check uv.lock
        run: uv lock --check

  # Packaging is only exercised by `release.yml` today, so a broken build,
  # a dropped `py.typed` or a missing vendored asset stays invisible until
  # release day. This builds every distribution and installs the published
  # one outside the workspace. It deliberately does not repeat the deeper
  # artifact validation `release.yml` runs against the exact tagged wheel.
  package:
    name: Build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Build every distribution
        run: uv build --all-packages --out-dir dist/

      - name: Every distribution built exactly one wheel and one sdist
        run: |
          set -euo pipefail
          uv run --no-project python - <<'EOF'
          import pathlib, sys

          # Derived from the workspace rather than hardcoded, so adding a
          # distribution extends this check instead of escaping it.
          expected = sorted(p.name for p in pathlib.Path("packages").iterdir() if p.is_dir())
          built = pathlib.Path("dist")

          failures = []
          for distribution in expected:
              stem = distribution.replace("-", "_")
              wheels = sorted(built.glob(f"{stem}-*.whl"))
              sdists = sorted(built.glob(f"{stem}-*.tar.gz"))
              if len(wheels) != 1:
                  failures.append(f"{distribution}: expected 1 wheel, found {[w.name for w in wheels]}")
              if len(sdists) != 1:
                  failures.append(f"{distribution}: expected 1 sdist, found {[s.name for s in sdists]}")

          surplus = sorted(
              path.name
              for path in built.iterdir()
              if not any(path.name.startswith(d.replace("-", "_") + "-") for d in expected)
          )
          if surplus:
              # A stale artifact would make a later glob validate something we
              # are not about to ship.
              failures.append(f"unexpected artifacts in dist/: {surplus}")

          for failure in failures:
              print(f"::error::{failure}")
          if failures:
              sys.exit(1)
          # Say what was inspected. A check that prints nothing on success
          # cannot be told apart from one that never received this script.
          print(f"built {len(expected)} distributions: {', '.join(expected)}")
          EOF

      - name: Install every distribution outside the workspace
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          if [[ "${#wheels[@]}" -eq 0 ]]; then
            echo "::error::no wheels to install"
            exit 1
          fi
          mkdir -p /tmp/ci-install && cd /tmp/ci-install
          uv venv --python 3.14 .venv

          # One environment holding every distribution, so the third-party
          # pins the adapters declare -- mcp and opentelemetry-api -- are
          # resolved by a real installer rather than assumed to be resolvable.
          # Installing them together also keeps the first-party requirements
          # satisfied by these wheels instead of by whatever the index offers
          # under the same version string.
          uv pip install --python .venv/bin/python "${wheels[@]}"

          # Address the interpreter directly: `uv run` may resolve an
          # environment other than the one the wheels were installed into.
          .venv/bin/python -I "$GITHUB_WORKSPACE/scripts/check_installed_distributions.py" \
            --workspace "$GITHUB_WORKSPACE" --require-installed

          # The published distribution additionally has to work on its own.
          .venv/bin/python -c "
          import agnara
          from agnara import Agnara, CapabilityId, Risk
          app = Agnara('smoke')
          assert app.name == 'smoke'
          assert '__version__' in agnara.__all__
          print('imported agnara', agnara.__version__)
          "

  # Aggregates every required check into one status, so branch protection
  # needs a single entry that does not have to be edited when the matrix
  # changes. See BACKLOG.md E0B.4.
  ci:
    name: CI
    if: always()
    needs: [lint, types, test, browser, lockfile, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - name: All required jobs succeeded
        run: echo "ok"
