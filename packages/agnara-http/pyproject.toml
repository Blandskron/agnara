[project]
name = "agnara-http"
version = "0.1.0a8"
description = "HTTP/ASGI exposure adapter for Agnara capabilities."
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "Agnara Maintainers", email = "maintainers@agnara.dev"}]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["agnara==0.1.0a8"]

[project.urls]
Homepage = "https://github.com/Blandskron/agnara"
Repository = "https://github.com/Blandskron/agnara"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnara_http"]
