[project]
name = "agnara-http"
version = "0.1.0a2"
description = "HTTP/ASGI exposure adapter for Agnara capabilities."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
dependencies = ["agnara"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnara_http"]
