[project]
name = "agnara-events"
version = "0.1.0a2"
description = "Event exposure abstractions for Agnara capabilities."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
dependencies = ["agnara"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnara_events"]
