[project]
name = "agnara-cli"
version = "0.1.0"
description = "Project introspection and scaffolding CLI for Agnara."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["agnara"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnara_cli"]
