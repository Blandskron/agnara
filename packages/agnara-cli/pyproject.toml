[project]
name = "agnara-cli"
version = "0.1.0a2"
description = "Project introspection and scaffolding CLI for Agnara."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
dependencies = ["agnara"]

[project.scripts]
agnara = "agnara_cli._main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnara_cli"]
