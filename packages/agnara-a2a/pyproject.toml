[project]
name = "agnara-a2a"
version = "0.0.0"
description = "Agent-to-Agent exposure adapter for Agnara capabilities."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["agnara"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnara_a2a"]
