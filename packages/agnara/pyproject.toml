[project]
name = "agnara"
version = "0.1.0"
description = "Capability-first, transport-neutral execution kernel for Agnara."
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "Agnara Maintainers", email = "maintainers@agnara.dev"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Blandskron/agnara"
Repository = "https://github.com/Blandskron/agnara"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnara"]
