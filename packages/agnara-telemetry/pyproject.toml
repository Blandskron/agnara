[project]
name = "agnara-telemetry"
version = "1.0.3"
description = "OpenTelemetry bridge for Agnara capability execution."
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "Agnara Maintainers", email = "maintainers@agnara.dev"}]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["agnara==1.0.3", "opentelemetry-api>=1.44,<2"]

[project.urls]
Homepage = "https://github.com/Blandskron/agnara"
Repository = "https://github.com/Blandskron/agnara"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnara_telemetry"]
