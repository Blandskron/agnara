[project]
name = "agnara-mcp"
version = "0.1.0a4.dev0"
description = "Model Context Protocol exposure adapter for Agnara capabilities."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
dependencies = ["agnara==0.1.0a4.dev0", "mcp==2.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agnara_mcp"]
