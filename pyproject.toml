# Agnara workspace root.
#
# This is a virtual uv workspace root: it is not itself a distributable
# package. Every distributable package lives under `packages/`.
#
# See ARCHITECTURE.md section 3 for the package boundaries and section 4
# for the allowed dependency graph.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agnara = { workspace = true }
agnara-http = { workspace = true }
agnara-mcp = { workspace = true }
agnara-a2a = { workspace = true }
agnara-events = { workspace = true }
agnara-telemetry = { workspace = true }
agnara-cli = { workspace = true }

[dependency-groups]
dev = [
    "agnara",
    "agnara-http",
    "agnara-mcp",
    "agnara-a2a",
    "agnara-events",
    "agnara-telemetry",
    "agnara-cli",
    # E6.10 comparison fixtures only. These must never enter a distributable
    # Agnara package or be confused with an HTTP implementation dependency.
    "fastapi==0.141.1",
    "litestar==2.24.0",
    "starlette==1.6.0",
    # Third-party schema adapters remain experiments until E2.7 compares
    # their performance and ergonomics. This is not a core dependency.
    "msgspec>=0.21,<0.22",
    "playwright==1.62.0",
    # E9.2 integration evidence only; applications own SDK configuration.
    "opentelemetry-sdk==1.44.0",
    "pydantic>=2.9,<3",
    # tests/release/test_publication_set.py parses the workflows to hold
    # them to docs/distributions.json, so this is a direct test dependency
    # rather than something inherited from a fixture package.
    "pyyaml>=6,<7",
    "pytest>=8.4",
    "ruff>=0.14",
    "ty>=0.0.1a1",
]

# --------------------------------------------------------------------------
# Ruff (E0.4)
# --------------------------------------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 100
# `scripts` is repository release tooling rather than a distributable
# package, but it is first-party source: without it here, isort files
# `import distributions` under third-party.
src = ["packages/*/src", "experiments", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

# Ruff also formats Python fenced blocks inside Markdown. The examples in
# docs/API_DESIGN.md and the RFCs are a design contract reviewed by humans,
# not code to be normalized -- docs/API_DESIGN.md exists precisely so that
# implementation convenience does not dictate the public API. Some blocks
# are also deliberately illustrative rather than valid Python.
exclude = ["**/*.md"]

# --------------------------------------------------------------------------
# ty (E0.5)
# --------------------------------------------------------------------------

[tool.ty.environment]
python-version = "3.14"
root = [
    # Each package exposes its import root from `src/`, per ADR 0017.
    "packages/agnara/src",
    "packages/agnara-http/src",
    "packages/agnara-mcp/src",
    "packages/agnara-a2a/src",
    "packages/agnara-events/src",
    "packages/agnara-telemetry/src",
    "packages/agnara-cli/src",
    # `tests` is itself a package, so the workspace root is what has to be
    # importable for `tests.architecture...` to resolve -- not `tests/`.
    ".",
    # The reviewed publication set is read from `scripts/distributions.py` by
    # the release tooling and by the architecture tests, so the import has to
    # resolve. `[tool.ty.src] include` still decides what is checked.
    "scripts",
]

[tool.ty.src]
include = ["packages", "examples", "experiments", "tests"]

# --------------------------------------------------------------------------
# pytest (E0.6)
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests", "packages"]
# `scripts/` holds the release tooling and is deliberately not an importable
# package, so there is no module path for the tests to reach it by. Putting it
# on the test path lets one module own the reviewed publication set instead of
# every consumer retyping the seven names.
pythonpath = ["scripts"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "browser: real-browser conformance tests enabled explicitly in their CI job",
]
